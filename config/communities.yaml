    trusted_voices:
      - {id: tv-nif-adviser, name: Migration adviser, role: independent migration adviser, can_review: [subject_expert, community_reviewer], languages: [en]}
      - {id: tv-nif-ar-volunteer, name: Arabic-speaking community volunteer, role: volunteer translator, can_review: [language_reviewer, community_reviewer], languages: [ar]}
      - {id: tv-nif-uk-volunteer, name: Ukrainian community volunteer, role: volunteer translator, can_review: [language_reviewer, community_reviewer], languages: [uk]}
      - {id: tv-nif-ru-volunteer, name: Russian-speaking community volunteer, role: volunteer translator, can_review: [language_reviewer, community_reviewer], languages: [ru]}
    cultural_context:
      - "Many services need a Finnish personal identity code, which takes a few weeks to get after registering."
      - "Official information is often only in Finnish and Swedish; the newsroom links the official page."

