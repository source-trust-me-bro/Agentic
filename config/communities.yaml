      - {id: tv-arabic-adviser, name: Migration adviser, role: independent migration adviser, can_review: [subject_expert], languages: [en, ar]}
    cultural_context:
      - "Arabic is written right to left; names, numbers and Finnish terms must stay readable inside Arabic text."
      - "Arabic-speaking communities come from many countries; avoid assuming one dialect or background."

