    needs_weights: {usefulness: 1.0, community: 0.9, understanding: 0.8, information: 0.7, emotion: 0.3, break: 0.2}
    lifecycle: {seasonal: false, typical_stay_days: 1095, onboarding_window_days: 30}
    channels:
