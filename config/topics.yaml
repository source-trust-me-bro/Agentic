# Starting shape of the news tree. These are illustrative branches, not a fixed taxonomy:
# the Knowledge Architect may propose new branches as events develop, and a human editor
# approves restructuring (new top-level branches, merges, moves).
#
# Topics are persistent subject areas. Events (one real-world development, with all the
# reports about it) hang under topics. Articles hang under events.

topics:
  - name: Local life · Oulu region
    keywords: [oulu, oulun, oulussa, pohjois-pohjanmaa, northern ostrobothnia]
