# Editorial policy as data, so editors can change it without touching code.

# Extra humans a HIGH-risk story needs besides the editor-in-chief, who always approves.
# Strict by default. To let the editor-in-chief alone approve these stories, set
# `high_risk_roles: []`. Language review never holds a story back: each language is
# published when its own reviewer approves it.
review:
  high_risk_roles: []

# Topics where an error can hurt someone. A story touching any of these is HIGH risk:
# it needs a named human subject expert, the official source linked, and (for non-source
# languages) a language reviewer. Keywords are matched case-insensitively.
high_risk_topics:
  residence_permit:
    keywords: [residence permit, residence card, visa, migri, citizenship, asylum, work permit, oleskelulupa, oleskeluluv, viisumi, kansalaisuus, turvapaikka, työlupa]
  health:
    keywords: [vaccin, medication, doctor, hospital, emergency, mental health, health insurance, kela, terveys, lääkäri, sairaala, rokote, päivystys]
  employment:
    keywords: [employment contract, wage, salary, minimum pay, dismissal, redundancy, collective agreement, working hours, työsopimus, työsopimuks, palkka, irtisanominen, työehto, ylityö]
  legal_rights:
    keywords: [tenant rights, eviction, deposit, court, fine, police, deportation, vuokra-asunto, häätö, takuuvuokra, oikeus, sakko]
  safety:
    keywords: [avalanche, wildfire, storm, evacuation, hypothermia, winter driving, black ice, icy road, hätä, myrsky, pelastus, jäinen tie, liukas]
elevated_topics:
  money_and_tax:
    keywords: [tax, taxes, tax card, verotus, vero, pension, benefit, etuus]
  housing:
    keywords: [housing, rent, lease, apartment, asunto, vuokra]

# Phrases that look like instructions aimed at an AI. They are never obeyed: matches are
# flagged on the article and the text is passed to models only inside an untrusted block.
injection_patterns:
  - "ignore (all |any )?(previous|prior|above) (instructions|prompts?)"
  - "disregard (the )?(system|previous) (prompt|instructions)"
  - "you are now"
  - "act as (a|an) "
  - "system prompt"
  - "reveal (your|the) (prompt|instructions|api key|secrets?)"
  - "(publish|approve) (this|the) (story|article) (now|immediately)"
  - "<\\s*/?\\s*(system|assistant|tool)\\s*>"
  - "unohda (kaikki )?(aiemmat|edelliset) ohjeet"

# Terms a translation must keep recognisable, with the form readers will meet in
# official Finnish documents. Translators keep the Finnish term in brackets.
protected_terms:
  - {term: "Migri", note: "Finnish Immigration Service"}
  - {term: "Kela", note: "Social Insurance Institution of Finland"}
  - {term: "Verohallinto", note: "Finnish Tax Administration"}
  - {term: "oleskelulupa", note: "residence permit"}
  - {term: "työsopimus", note: "employment contract"}
  - {term: "vuokrasopimus", note: "rental agreement"}
  - {term: "Suomi.fi", note: "official online service"}

# AI disclosure printed on every story and rendition (JSN 7-11: be open about sources
# and methods; the audience must know how the story was made).
disclosure:
  en: >
    Prepared by an AI-assisted newsroom and approved by a named human editor. Original
    reporting is linked below. Tell us if something is wrong.
  fi: >
    Laadittu tekoälyavusteisessa toimituksessa ja hyväksytty nimetyn toimittajan
    toimesta. Alkuperäiset lähteet on linkitetty. Kerro meille, jos jokin on virheellistä.
  sv: >
    Framtagen av en AI-stödd redaktion och godkänd av en namngiven redaktör. Originalrapporteringen
    är länkad nedan. Berätta för oss om något är fel.
  ar: >
    أُعدّت هذه المادة في غرفة أخبار تستعين بالذكاء الاصطناعي ووافق عليها محرر بشري مُسمّى.
    روابط التقارير الأصلية أدناه. أخبرنا إذا كان هناك أي خطأ.
